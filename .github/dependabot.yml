# Weekly dependency updates. Every update arrives as a pull request with a
# Conventional Commit title (deps: ...) and runs the full CI. A version
# update waits 7 days after its release (cooldown), so a malicious or broken
# release has time to be found first; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      otel:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /tools/gremlins
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    open-pull-requests-limit: 3
