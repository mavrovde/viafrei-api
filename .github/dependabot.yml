# Weekly dependency updates. Every update arrives as a pull request with a
# Conventional Commit title (deps: ...) and runs the full CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    groups:
      otel:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    # The database image follows the platform's production database, which
    # runs PostgreSQL 16 / PostGIS 3.4; a major bump would test against a
    # server production does not run. Move it when the platform moves.
    ignore:
      - dependency-name: postgis/postgis
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
