# Nightly load and fault runs (TST-007, issue #19): the soak (design load for
# one hour), the stress ramp past the knee, the spike, and every fault of the
# Performance Test Plan through the fault proxy and container control, on the
# test stack this job starts. Nothing but that stack's loopback is a target
# (TST-010): the runner refuses every host not on test/load/allow-list.txt.
#
# The report names every scenario, its assertions and its counts; it is the
# job summary and an artifact kept for the release evidence. A scenario that
# sent no request fails.
#
# Each run also writes its figures (load-report.json) into that artifact. A
# run on main fetches the figures of the newest successful nightly run on
# main and the report compares the two (TST-021, issue #80): a p95 or p99
# regression beyond the tolerance fails the run, and a missing or unreadable
# previous file is named in the report, never read as "no change".
name: Load nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Budget (pr for a quick check, nightly for the full run)
        default: nightly

permissions:
  contents: read
  actions: read # the previous nightly run's artifact (scripts/load-previous.sh)

concurrency:
  group: load-nightly
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  load:
    name: Soak, stress, spike and faults (nightly budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4" # must equal the toolchain line of go.mod (TestWorkflowsUseTheGoModToolchain)
      - name: The previous main run's figures (TST-021)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/load-previous.sh previous
      - name: Every scenario on the test stack
        env:
          PROFILE: ${{ inputs.profile || 'nightly' }}
          # On main the run is compared with the previous main run's figures;
          # when there are none the report names the absent file.
          LOADRUN_PREVIOUS: ${{ github.ref == 'refs/heads/main' && 'previous/load-report.json' || '' }}
        run: scripts/load-test.sh "$PROFILE" load-report.md
      - name: Report in the job summary
        if: always() && hashFiles('load-report.md') != ''
        run: cat load-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-nightly
          path: |
            load-report.md
            load-report.json
          retention-days: 90
          if-no-files-found: error
