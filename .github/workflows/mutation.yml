# Mutation testing (TST-002, issue #17) of the domain, access and admission
# code of test/mutation/scope.tsv, with Gremlins scored by
# internal/testkit/mutgate.
#
# Once per release, never per pull request (owner 2026-11-18, as in
# viafrei-database and viafrei-web): release.yml calls this workflow on the
# tagged commit before anything is built, and a red run stops the publish.
# It is the full run over every in-scope mutant, failing below 70 % and on a
# stale equivalent entry; a manual run does the same on the chosen ref. The
# report lists the counts and every mutant not detected.
#
# The full run is cut into four parallel shards (the viafrei-database
# release split, mirrored): Mutation shard k mutates the scope roots at the
# positions p of test/mutation/scope.tsv with p mod 4 = k - 1 (mutgate -plan
# -shard k/4; the four are disjoint, together every root and none empty,
# internal/testkit/mutgate/shard_test.go), and the Mutation testing job
# gathers their reports into one full-mode gate, which refuses a root with
# no report. Mutation testing is green only when every shard finished green.
name: Mutation

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to mutate (the release's tagged commit)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  # The mode, read once: always the full run (the pr mode of
  # scripts/mutation.sh stays for a local run only).
  plan:
    name: Mutation plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: mode
        name: full
        run: |
          echo "mutation: full run"
          echo "mode=full" >> "$GITHUB_OUTPUT"

  # One shard of the full run each; fail-fast is off, so one run reports
  # every failing shard. Exit 2 (red) on an empty shard or a bad K/N.
  shards:
    name: Mutation shard
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4" # must equal the toolchain line of go.mod (TestWorkflowsUseTheGoModToolchain)
      - name: The scope roots of the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/mutation.sh shard "$SHARD/4" mutation-shard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutation-shard/
          if-no-files-found: error
          retention-days: 7

  # The gate: in pr mode the changed code, in full mode the fan-in of the
  # shards. It runs unless the run was cancelled, so a shard that failed,
  # timed out or never started (failure, cancelled or skipped, never
  # success) fails a full run before any report is read.
  mutation:
    name: Mutation testing
    needs: [plan, shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4" # must equal the toolchain line of go.mod (TestWorkflowsUseTheGoModToolchain)
      - name: Every shard finished with its reports
        if: needs.plan.outputs.mode == 'full'
        env:
          SHARDS: ${{ needs.shards.result }}
        run: |
          [[ $SHARDS == success ]] || { echo "::error::the mutation shards ended '$SHARDS', not success: a shard that failed, refused or did not finish (see the Mutation shard jobs)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.mode == 'full'
        with:
          pattern: mutation-shard-*
          path: mutation-shards
      - name: Mutation testing
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "mutation: $MODE run"
          if [[ $MODE == full ]]; then
            scripts/mutation.sh gather mutation-shards mutation-report.md
          elif [[ $MODE == pr ]]; then
            scripts/mutation.sh pr "origin/$BASE_REF" mutation-report.md
          else
            echo "::error::the plan job gave no mode ('$MODE')"
            exit 1
          fi
      - name: Report in the job summary
        if: always()
        run: if [[ -f mutation-report.md ]]; then cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: mutation-report.md
          if-no-files-found: ignore
          retention-days: 30
