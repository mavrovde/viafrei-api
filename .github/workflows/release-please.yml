# Keeps the release pull request up to date from the Conventional Commits on
# main. When that pull request is merged, release-please writes a DRAFT
# release (a draft creates no tag); the next job creates the annotated tag
# vX.Y.Z on the release commit and runs release.yml, which builds, signs,
# attests, attaches the assets, publishes the draft, verifies the result and
# publishes the docs to GitHub Pages.
# release.yml is called directly because a tag pushed with GITHUB_TOKEN does
# not start other workflows.
#
# It runs after CI has passed on a push to main, and scripts/ci-gate.sh checks
# the release commit's CI result again before the tag is created (REL-015).
# The release pull request is opened with the built-in GITHUB_TOKEN (the
# repository allows GitHub Actions to create pull requests). GitHub holds the
# pull_request runs of CI and Security for that pull request as
# "action_required", and branch protection reads only pull_request runs, so the
# next step approves them (scripts/approve-release-runs.sh).
name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    # A CI run on a push to this repository's main that succeeded, or a
    # maintainer by hand. The event and repository checks keep out a fork's
    # pull request from a branch named main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write # approves CI and Security on the release pull request
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The approval script is read from main's checkout, not the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.rp.outputs.pr != ''
        with:
          persist-credentials: false
      - name: Approve CI and Security on the release pull request
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"$PR")
          scripts/approve-release-runs.sh "$branch"

  tag:
    name: Annotated tag
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3" # must equal the toolchain line of go.mod (TestWorkflowsUseTheGoModToolchain)
      - name: CI passed on the release commit (REL-015)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: scripts/ci-gate.sh "$SHA"
      - name: Create and push the annotated tag
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release-please produced tag '$TAG', not vX.Y.Z"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG exists already; tags are never moved"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

  release:
    name: Release
    needs: [release-please, tag]
    # A called workflow gets at most what its caller grants: release.yml's
    # gate reads check runs and workflow runs.
    permissions:
      contents: write
      checks: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      issues: write
      pages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
