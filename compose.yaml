# Local development stack: the API and a PostGIS database (the platform's
# postgis/postgis:16-3.4) migrated by the viafrei-database release
# database.pin names, holding a synthetic fixture set that the same release's
# test seed writes.
#
#   cp .env.example .env    # then replace both placeholders
#   make up                 # build and start, wait until healthy
#   curl -s localhost:8080/v1/meta
#   curl -s localhost:8082/readyz    # the health listener
#
# Only the API is published, on the loopback interface: its public listener
# and its health listener. The database is reachable from the stack alone.
# Nothing here holds real data: the database is named test_contract, the only
# kind of name the release's test seed writes into.

name: viafrei-api

services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    platform: linux/amd64 # the upstream PostGIS image is single-architecture
    # The partitions of every fixture day are made in one transaction.
    command: ["-c", "max_locks_per_transaction=4096"]
    environment:
      POSTGRES_DB: test_contract
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db16-data:/var/lib/postgresql/data
    # Over TCP: the image's first-boot server listens on the socket alone and
    # then restarts, so a socket check passes before the network can connect.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U owner -d test_contract"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [backend]

  # The platform's schema, from the release database.pin names (the image
  # below must equal its first line; TestComposeRules holds them equal): it
  # says which release it is, applies its migrations and the settings it
  # gives each role in this database, makes the daily partitions from the day
  # before the fixtures' first day, must report READY at the pinned head, and
  # gives the API's read-only role its password. It runs on every start and
  # changes nothing on a database already at the head.
  db-migrate:
    image: ghcr.io/mavrovde/viafrei-database:0.7.0@sha256:617c85fcb0acae7d1d6a4e52c469d1dcfd9e4646f369256cfc77bdea2c43f85a
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/test_contract?sslmode=disable
      API_READER_PASSWORD: ${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node /app/dist/cli.js migrate
        node /app/dist/cli.js partitions ensure --days 7 --from 2026-03-27
        node /app/dist/cli.js head | tee /dev/stderr | grep -qx "READY $$(node /app/dist/cli.js version | sed -n 's/.* schema-head //p')"
        echo "alter role api_reader password :'pw';" | psql -X -q -v ON_ERROR_STOP=1 -v pw="$$API_READER_PASSWORD" "$$DATABASE_URL"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  # The synthetic fixture set (FIXTURE_PROFILE, FIXTURE_SEED), written by
  # fixturegen in the read contract's own shape and handed to db-seed in a
  # volume.
  fixtures:
    build:
      context: .
      target: fixtures
      args:
        FIXTURE_PROFILE: ${FIXTURE_PROFILE:-tiny}
        FIXTURE_SEED: ${FIXTURE_SEED:-1}
    # Readable by db-seed, which runs as the database image's own user:
    # fixturegen writes the manifest owner-only.
    entrypoint: ["/bin/sh", "-ec", "install -m 0644 /out/fixtures/seed.sql /out/fixtures/manifest.json /seed/"]
    volumes:
      - seed:/seed
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The API's test seed (internal/testkit/baseseed) writes the set into the
  # platform's tables, once, with the release's psql:
  # a database whose contract already lists a place is left as it is
  # (`make reset` starts over). Not the source register: the migrations
  # write that themselves. The image must equal db-migrate's.
  db-seed:
    image: ghcr.io/mavrovde/viafrei-database:0.7.0@sha256:617c85fcb0acae7d1d6a4e52c469d1dcfd9e4646f369256cfc77bdea2c43f85a
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      fixtures:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/test_contract?sslmode=disable
      VF_TEST_FIXTURES: "1"
    volumes:
      - seed:/seed:ro
      - ./internal/testkit/baseseed/base_seed.sql:/baseseed/base_seed.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$(psql -X -tA -c 'select exists (select 1 from contract.place)' "$$DATABASE_URL")" = t ]; then
          echo "fixtures already seeded"
        else
          sum=$$(tr -d '\n' < /seed/manifest.json | sed -n 's/.*"checksum": *"\([^"]*\)".*/\1/p')
          [ -n "$$sum" ] || { echo "/seed/manifest.json names no checksum" >&2; exit 1; }
          { cat /baseseed/base_seed.sql; echo "select vf_test.contract_seed_begin('seed.sql');"; sed 's/^insert into contract\./insert into vf_seed./' /seed/seed.sql; echo "select vf_test.contract_seed_end();"; } |
            psql -X -q -1 -v ON_ERROR_STOP=1 "$$DATABASE_URL" > /dev/null
          echo "fixtures seeded: $$sum"
        fi
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  api:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-0.3.0-dev}
        COMMIT: ${COMMIT:-unknown}
    image: viafrei-api:local
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    environment:
      VFAPI_SERVER_LISTEN_ADDR: ":8080"
      VFAPI_HEALTH_LISTEN_ADDR: ":8082"
      # The public listener refuses every caller off this list (fail
      # closed). Published on the loopback alone, the local stack admits
      # every caller that reaches it.
      VFAPI_CALLERS_ALLOW_CIDR: "0.0.0.0/0,::/0"
      VFAPI_DB_URL: postgres://api_reader:${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}@db:5432/test_contract?sslmode=disable
      # The per-address limit of keyless requests (RATE-001); the fuzzing
      # scripts switch it off with 0, see docs/rate-limits.md.
      VFAPI_RATELIMIT_ANON_RPS: ${VFAPI_RATELIMIT_ANON_RPS:-1}
    ports:
      # Loopback only. Override API_PUBLISH in .env on a host without IPv6 loopback.
      - "${API_PUBLISH:-[::1]:8080}:8080"
      - "${API_HEALTH_PUBLISH:-[::1]:8082}:8082"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Design targets for one instance; see docs/container.md.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend, frontend]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db16-data: {}
  seed: {}
