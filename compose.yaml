# Local development stack: the API and a PostGIS database holding the
# read-contract stub, the read-only role and a synthetic fixture set.
#
#   cp .env.example .env    # then replace both placeholders
#   make up                 # build and start, wait until healthy
#   curl -s localhost:8080/v1/meta
#
# Only the API is published, on the loopback interface. The database is
# reachable from the API container alone. Nothing here holds real data.

name: viafrei-api

services:
  db:
    build:
      context: .
      target: devdb
      args:
        FIXTURE_PROFILE: ${FIXTURE_PROFILE:-tiny}
        FIXTURE_SEED: ${FIXTURE_SEED:-1}
    platform: linux/amd64 # the upstream PostGIS image is single-architecture
    environment:
      POSTGRES_DB: contract
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_READER_PASSWORD: ${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d contract && psql -U owner -d contract -tAc 'select 1 from contract.contract_info' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [backend]

  api:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-0.2.0-dev}
        COMMIT: ${COMMIT:-unknown}
    image: viafrei-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      VFAPI_SERVER_LISTEN_ADDR: ":8080"
      VFAPI_DB_URL: postgres://api_reader:${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}@db:5432/contract?sslmode=disable
    ports:
      # Loopback only. Override API_PUBLISH in .env on a host without IPv6 loopback.
      - "${API_PUBLISH:-[::1]:8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Design targets for one instance; see docs/container.md.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend, frontend]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db-data: {}
