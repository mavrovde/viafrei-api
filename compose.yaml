# Local development stack: the API and a PostGIS database (the platform's
# postgis/postgis:16-3.4) migrated by the viafrei-database release
# database.pin names, beside the read-contract stub, the read-only role and a
# synthetic fixture set.
#
#   cp .env.example .env    # then replace both placeholders
#   make up                 # build and start, wait until healthy
#   curl -s localhost:8080/v1/meta
#   curl -s localhost:8082/readyz    # the health listener
#
# Only the API is published, on the loopback interface: its public listener
# and its health listener. The database is reachable from the API container
# alone. Nothing here holds real data.

name: viafrei-api

services:
  db:
    build:
      context: .
      target: devdb
      args:
        FIXTURE_PROFILE: ${FIXTURE_PROFILE:-tiny}
        FIXTURE_SEED: ${FIXTURE_SEED:-1}
    platform: linux/amd64 # the upstream PostGIS image is single-architecture
    environment:
      POSTGRES_DB: contract
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_READER_PASSWORD: ${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}
    volumes:
      - db16-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d contract && psql -U owner -d contract -tAc 'select 1 from contract.contract_info' | grep -q 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [backend]

  # The platform's schema, from the release database.pin names (the image
  # below must equal its first line; TestComposeRules holds them equal): it
  # says which release it is, applies its migrations and the settings it
  # gives each role in this database, makes the daily partitions and must
  # report READY at the pinned head. It runs on every start and changes
  # nothing on a database already at the head.
  db-migrate:
    image: ghcr.io/mavrovde/viafrei-database:0.2.0@sha256:98f0e01b8bb2f34afac8b482bd701ee61fa7bf142cc03d413e83c3b8b605ec9f
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://owner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/contract?sslmode=disable
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        node /app/dist/cli.js migrate
        node /app/dist/cli.js partitions ensure --days 7
        node /app/dist/cli.js head | tee /dev/stderr | grep -qx "READY $$(node /app/dist/cli.js version | sed -n 's/.* schema-head //p')"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  api:
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-0.2.0-dev}
        COMMIT: ${COMMIT:-unknown}
    image: viafrei-api:local
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      VFAPI_SERVER_LISTEN_ADDR: ":8080"
      VFAPI_HEALTH_LISTEN_ADDR: ":8082"
      # The public listener refuses every caller off this list (fail
      # closed). Published on the loopback alone, the local stack admits
      # every caller that reaches it.
      VFAPI_CALLERS_ALLOW_CIDR: "0.0.0.0/0,::/0"
      VFAPI_DB_URL: postgres://api_reader:${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}@db:5432/contract?sslmode=disable
      # The per-address limit of keyless requests (RATE-001); the fuzzing
      # scripts switch it off with 0, see docs/rate-limits.md.
      VFAPI_RATELIMIT_ANON_RPS: ${VFAPI_RATELIMIT_ANON_RPS:-1}
    ports:
      # Loopback only. Override API_PUBLISH in .env on a host without IPv6 loopback.
      - "${API_PUBLISH:-[::1]:8080}:8080"
      - "${API_HEALTH_PUBLISH:-[::1]:8082}:8082"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Design targets for one instance; see docs/container.md.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend, frontend]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db16-data: {}
