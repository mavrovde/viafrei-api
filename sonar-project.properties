# SonarCloud CI-based analysis (the scan runs in the CI workflow's sonar job).
sonar.organization=mavrovde
sonar.projectKey=mavrovde_viafrei-api
sonar.projectName=viafrei-api
sonar.host.url=https://sonarcloud.io

sonar.sources=.
# Excluded from analysis, each for a reason:
#   tests and testdata       analysed as tests (sonar.test.inclusions), not as sources
#   api/openapi.json         generated from the code by "viafrei-api openapi"
#   docs                     prose, no code
sonar.exclusions=**/*_test.go,**/*.test.js,**/testdata/**,api/openapi.json,docs/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.js
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-unit.json
# The documentation portal's accessibility runners (scripts/a11y-tools/
# axe-runner.js and layout-runner.js), covered by their node:test unit tests in the docs-portal job
# (scripts/docs-a11y-runner.test.sh, held to 100 %), and its privacy check
# (scripts/a11y-tools/offsite.js, scripts/docs-offsite.test.sh, held to 100 %).
sonar.javascript.lcov.reportPaths=coverage-a11y-runner.lcov,coverage-offsite.lcov
