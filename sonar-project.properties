# SonarCloud CI-based analysis (the scan runs in the CI workflow's sonar job).
sonar.organization=mavrovde
sonar.projectKey=mavrovde_viafrei-api
sonar.projectName=viafrei-api
sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**,internal/adapters/store/contractdb/**,api/openapi.json,docs/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-unit.json
