# The test stack of the load and fault scenarios (TST-007, issue #19):
# compose.yaml plus this file, started by scripts/load-test.sh and by nothing
# else. It adds a latency and fault proxy (Toxiproxy) between the service
# and both of its stores, and an access store in the same throwaway
# database, so storage and the access store can be slowed or cut apart.
#
#   docker compose -f compose.yaml -f test/load/compose.yaml up --wait
#
# Paths are relative to the repository root, the directory of compose.yaml.
# Only the API and the fault proxy's API are published, on the loopback
# address. Nothing here holds real data or reaches beyond this machine.

services:
  db:
    environment:
      API_ACCESS_PASSWORD: ${API_ACCESS_PASSWORD:?set API_ACCESS_PASSWORD (scripts/load-test.sh does)}
    volumes:
      - ./db/access:/access:ro
      - ./test/load/initdb/40_access.sh:/docker-entrypoint-initdb.d/40_access.sh:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./test/load/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      # The fault proxy's API, loopback only: the runner injects faults here.
      - "${TOXIPROXY_PUBLISH:-[::1]:8474}:8474"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  api:
    depends_on:
      toxiproxy:
        condition: service_started
    environment:
      # Storage and the access store, both through the fault proxy.
      VFAPI_DB_URL: postgres://api_reader:${API_READER_PASSWORD:?set API_READER_PASSWORD in .env}@toxiproxy:15432/contract?sslmode=disable
      VFAPI_ACCESS_URL: postgres://api_access:${API_ACCESS_PASSWORD:?set API_ACCESS_PASSWORD (scripts/load-test.sh does)}@toxiproxy:15433/contract?sslmode=disable
      VFAPI_AUTH_PEPPER: ${VFAPI_AUTH_PEPPER:?set VFAPI_AUTH_PEPPER (scripts/load-test.sh does)}
      # A cached key outlives every scenario, so "a key in the key cache keeps
      # working while the access store is down" does not depend on when the
      # key was first read (NFR-RES-005).
      VFAPI_AUTH_KEY_CACHE_TTL: 10m
      # The runner sends from one address; the per-address limit of keyless
      # requests would answer it alone. The keyed limits stay on.
      VFAPI_RATELIMIT_ANON_RPS: "0"
      # The runner repeats the same few requests, so the result cache would
      # answer them from memory and no fault would reach storage: every
      # request has to reach the path its scenario cuts. The cache has its
      # own tests (unit, integration and the benchmark leg).
      VFAPI_CACHE_ENABLED: "false"
      # The storage-killed scenario holds storage down longer than twice
      # this, so a failed half-open probe opening the breaker again is
      # observed; the runner's -breaker-open-for says the same (NFR-RES-002).
      VFAPI_BREAKER_OPEN_FOR: 2s
